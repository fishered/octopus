apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: octopus-mgmt, namespace: octopus }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: octopus-mgmt } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: octopus-collect, namespace: octopus }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: octopus-collect } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: octopus-control, namespace: octopus }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: octopus-control } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: octopus-ca, namespace: octopus }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: octopus-ca } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: octopus-mgmt, namespace: octopus }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: octopus-mgmt }
  minReplicas: 2
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: octopus-control, namespace: octopus }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: StatefulSet, name: octopus-control }
  minReplicas: 2
  maxReplicas: 20
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
