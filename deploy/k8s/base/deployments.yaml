apiVersion: apps/v1
kind: Deployment
metadata: { name: octopus-mgmt, namespace: octopus }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: octopus-mgmt } }
  template:
    metadata: { labels: { app.kubernetes.io/name: octopus-mgmt, app.kubernetes.io/part-of: octopus } }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app.kubernetes.io/name: octopus-mgmt } } }
      containers:
        - name: app
          image: registry.example.com/octopus/octopus-mgmt:0.1.0
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: octopus-config } }, { secretRef: { name: octopus-secrets } }]
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "2", memory: 1Gi } }
          startupProbe: &startup { httpGet: { path: /actuator/health/liveness, port: http }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: &ready { httpGet: { path: /actuator/health/readiness, port: http }, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3 }
          livenessProbe: &live { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
          securityContext: &containerSecurity { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes: [{ name: tmp, emptyDir: { medium: Memory, sizeLimit: 128Mi } }]
---
