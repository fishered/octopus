apiVersion: apps/v1
kind: Deployment
metadata: { name: octopus-agent, namespace: octopus }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: octopus-agent } }
  template:
    metadata: { labels: { app.kubernetes.io/name: octopus-agent, app.kubernetes.io/part-of: octopus } }
