name: octopus

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: octopus
      POSTGRES_USER: octopus_app
      POSTGRES_PASSWORD: ${OCTOPUS_PG_PASSWORD:?Set OCTOPUS_PG_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octopus_app -d octopus"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${OCTOPUS_REDIS_PASSWORD:?Set OCTOPUS_REDIS_PASSWORD}"]
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$OCTOPUS_REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      OCTOPUS_REDIS_PASSWORD: ${OCTOPUS_REDIS_PASSWORD:?Set OCTOPUS_REDIS_PASSWORD}

  kafka:
    image: apache/kafka:4.0.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["9092:9092"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.0.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic octopus.local.telemetry.raw.v1 --partitions 12 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic octopus.local.telemetry.quarantine.v1 --partitions 3 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=2592000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic octopus.local.telemetry.normalized.v1 --partitions 12 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic octopus.local.catalog.meter-configuration.v1 --partitions 6 --replication-factor 1 --config cleanup.policy=compact
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic octopus.local.command.requested.v1 --partitions 12 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic octopus.local.command.status.v1 --partitions 12 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=2592000000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic octopus.local.shadow.reported.v1 --partitions 12 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic octopus.local.shadow.quarantine.v1 --partitions 3 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=2592000000

  influxdb:
    image: influxdb:2.7-alpine
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: octopus
      DOCKER_INFLUXDB_INIT_PASSWORD: ${OCTOPUS_INFLUX_PASSWORD:?Set OCTOPUS_INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${OCTOPUS_INFLUX_TOKEN:?Set OCTOPUS_INFLUX_TOKEN}
      DOCKER_INFLUXDB_INIT_ORG: octopus
      DOCKER_INFLUXDB_INIT_BUCKET: octopus-telemetry
      DOCKER_INFLUXDB_INIT_RETENTION: 604800
    ports: ["8086:8086"]
    volumes: ["influx-data:/var/lib/influxdb2"]
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mqtt:
    image: eclipse-mosquitto:2.0
    ports: ["1883:1883"]
    volumes:
      - ./deploy/local/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  influx-data:
  mqtt-data:
