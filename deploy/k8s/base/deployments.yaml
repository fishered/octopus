apiVersion: apps/v1
kind: StatefulSet
metadata: { name: octopus-control, namespace: octopus }
spec:
  serviceName: octopus-control-headless
  podManagementPolicy: Parallel
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: octopus-control } }
  template:
    metadata: { labels: { app.kubernetes.io/name: octopus-control, app.kubernetes.io/part-of: octopus } }
    spec:
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: registry.example.com/octopus/octopus-control:0.1.0
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: octopus-config } }, { secretRef: { name: octopus-secrets } }]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: mqtt-tls, mountPath: /run/secrets/octopus-mqtt, readOnly: true }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "2", memory: 1Gi } }
          startupProbe: { httpGet: { path: /actuator/health/liveness, port: http }, failureThreshold: 30, periodSeconds: 5 }
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 3 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, periodSeconds: 10, timeoutSeconds: 2, failureThreshold: 3 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes:
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 128Mi } }
        - { name: mqtt-tls, secret: { secretName: octopus-mqtt-tls, optional: true } }
---
