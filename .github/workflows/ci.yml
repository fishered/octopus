name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify reactor
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
      - uses: azure/setup-kubectl@v4
      - name: Render Kubernetes base
        run: kubectl kustomize deploy/k8s/base > /dev/null
